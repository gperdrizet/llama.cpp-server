# Globals for all models
[*]

# Server
host               = 0.0.0.0
port               = 8080
models-max         = 2
lazy-mode          = off
flash-attn         = on
n-gpu-layers       = -1
device             = CUDA0
jinja              = true

# KV cache & context
cache-type-k       = q8_0
cache-type-v       = q8_0
cache-ram          = -1
cache-idle-slots   = true
no-context-shift   = true
parallel           = 1
threads            = 12
threads-batch      = 12

# Model
metrics            = true
no-log-timestamps  = true
no-log-prefix      = true
verbosity          = 3


# --------------------------------------------------------
# Qwen3.5 4B
# Single GPU, fully resident

[Qwen3.5-4B]

# Model
alias                  = Qwen3.5-4B
model                  = /models/Qwen3.5-4B-Q4_K_M.gguf

# Context
ctx-size               = 131072
batch-size             = 4096
ubatch-size            = 2048

# Decoding
temp                   = 0.1
top-p                  = 0.8
top-k                  = 20
repeat-penalty         = 1.05

# --------------------------------------------------------
# BGM-M3 embedding model
# Single GPU, fully resident

[BGE-M3]

# Model
alias                  = BGE-M3
model                  = /models/bge-m3-Q4_K_M.gguf
embedding              = true

# Context
ctx-size               = 4096
ubatch-size            = 1024