# ========================================================
# General settings/defaults
# ========================================================
#
# llama.cpp server ags documentation:
# https://github.com/ggml-org/llama.cpp/blob/master/tools/server/README.md

[*]

# Load all layers on GPU(s)
n-gpu-layers    = -1

# Load and stay loaded on startup
load-on-startup = true
stop-timeout    = 0

# Unload models from VRAM automatically after 5 minutes of total silence
# sleep-idle-seconds = 300 

# Batch sizes - larger gives faster prefill at the cost of more VRAM usage
; batch-size         = 4096
; ubatch-size        = 4096


# ========================================================
# Utility models
# ========================================================

# --------------------------------------------------------
# Qwen3.8-27B, reasoning low
# Dual GPU, fully resident, MTP draft decoding
#
# Cold TFT: ~48 seconds, Warm TFT: ~10 seconds
# Preprocessing/generation: 400/33 TPS
#
# Unsloth guide: https://unsloth.ai/docs/models/qwen3.8

[Qwen2.5-coder-7B]

# Model
alias                 = default
model                 = /home/siderealyear/llama.cpp/models/Qwen2.5-Coder-7B-Instruct-Q3_K_M.gguf
; chat-template-file    = /home/siderealyear/llama.cpp/utils/qwen_chat.jinja
parallel              = 1
device                = CUDA0,CUDA1
split-mode            = tensor

# Context
ctx-size              = 65536
cache-type-k          = q8_0
cache-type-v          = q8_0
; batch-size            = 4096
; ubatch-size           = 2048

# Reasoning
; reasoning-budget      = 16384
; reasoning-format      = deepseek
; no-reasoning-preserve = true
; chat-template-kwargs  = {"reasoning_effort":"low"}
; reasoning-budget-message = "... Thinking time limit reached. Stop reasoning and provide the final response now."

# Decoding
temp                 = 0.1
top-p                = 0.95
top-k                = 40
repeat-penalty       = 1.0

# --------------------------------------------------------
# Qwen3.5-9B instruct (thinking off)
# Single GPU, fully resident, dflash draft decoding
#
# Cold TFT: ~18 seconds, Warm TFT: ~5 seconds
# Preprocessing/generation: 700/39 TPS
#
# Unsloth guide: https://unsloth.ai/docs/models/qwen3.5

; [Qwen3.5-9B]

; # Model
; alias                  = Qwen3.5-9B
; model                  = /home/siderealyear/llama.cpp/models/Qwen3.5-9B-Q4_K_M.gguf
; chat-template-file     = /home/siderealyear/llama.cpp/utils/qwen_chat.jinja
; parallel               = 2
; device                 = CUDA0

; # Context
; ctx-size               = 65536
; cache-type-k           = q8_0
; cache-type-v           = q8_0
; batch-size             = 4096
; ubatch-size            = 2048

; # Reasoning
; chat-template-kwargs   = {"enable_thinking": false}

; # Decoding
; temp                   = 0.7
; top-p                  = 0.8
; top-k                  = 20
; min-p                  = 0.0
; presence-penalty       = 1.5
; repeat-penalty         = 1.0

; # Speculative decoding
; model-draft            = /home/siderealyear/llama.cpp/models/Qwen3.5-9B-dflash-Q4_K_M.gguf
; spec-type              = draft-dflash
; spec-draft-n-max       = 3


