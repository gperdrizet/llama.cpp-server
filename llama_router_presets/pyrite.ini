parallel              = 1
split-mode            = layer
n-gpu-layers          = 40
cpu-moe               = true
load-mode             = mlock

# Context
ctx-size              = 262144
cache-type-k          = q8_0
cache-type-v          = q8_0
batch-size            = 4096
