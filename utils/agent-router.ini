[*]
# Load all layers on GPU(s)
n-gpu-layers = -1

# Unload models from VRAM automatically after 5 minutes of total silence
sleep-idle-seconds = 300 

# ==========================================
# 1. Big Reasoning Qwen (Pooled GPUs)
# ==========================================
[Qwen3.8-27B]
alias                = Qwen3.8-27B
model                = /home/siderealyear/llama.cpp/models/Qwen3.8-27B-UD-Q4_K_M.gguf
ctx-size             = 200000
split-mode           = tensor
spec-type            = draft-mtp
spec-draft-n-max     = 3
chat-template-kwargs = {"reasoning_effort":"low"}
reasoning-budget     = 16384
reasoning-budget-message = "... Thinking time limit reached. Stop reasoning and provide the final response now."

# ===============================================
# 2. Conversational GPT (Pinned to GPU 0)
# ===============================================
[gpt-oss-20b]
alias                = gpt-oss-20b
model                = /home/siderealyear/llama.cpp/models/gpt-oss-20b-Q4_K_M.gguf
ctx-size             = 131072
device               = CUDA0

# ===============================================
# 3. Coder Model (Pinned to GPU 1)
# ===============================================
[Qwen2.5-Coder-7B-Instruct]
alias                = Qwen2.5-Coder-7B-Instruct
model                = /home/siderealyear/llama.cpp/models/qwen2.5-coder-7b-instruct-q4_k_m.gguf
ctx-size             = 131072
device               = CUDA1

# ===============================================
# 4. Experimental Ternary Bonsai 27B (tensor-split, both GPUs)
# ===============================================
[Ternary-Bonsai-Q2]
alias                = Ternary-Bonsai-Q2
model                = /home/siderealyear/llama.cpp/models/Ternary-Bonsai-2-27B-PQ2_0.gguf
ctx-size             = 262144
split-mode           = tensor
spec-type            = draft-mtp
spec-draft-n-max     = 3
chat-template-kwargs = {"reasoning_effort":"low"}
reasoning-budget     = 16384
reasoning-budget-message = "... Thinking time limit reached. Stop reasoning and provide the final response now."