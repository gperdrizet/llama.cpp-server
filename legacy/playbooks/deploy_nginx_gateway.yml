- name: Point public LLM gateway (nginx 8502) at the LiteLLM router (8506)
  hosts: pyrite
  become: yes

  vars:
    gateway_dest: /etc/nginx/sites-available/llama-gateway
    gateway_symlink: /etc/nginx/sites-enabled/llama-gateway
    profile_dir: /etc/nginx/llama-profiles
    backup_dir: /var/backups/nginx-gateway

  tasks:

    # Pin the backup timestamp ONCE. A `vars:` entry with a lookup('pipe')
    # re-evaluates on every reference, so each task would see a different
    # second and the "create dir" task and the "copy into it" task would
    # disagree about the path. set_fact fixes it for the whole run.
    - name: Set a stable backup timestamp (compute once for the whole run)
      ansible.builtin.set_fact:
        backup_stamp: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"

    # --- Backup current config + dead profile dir before touching anything ---
    - name: Create backup base dir
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: '0755'

    - name: Create this run's backup dir
      ansible.builtin.file:
        path: "{{ backup_dir }}/{{ backup_stamp }}"
        state: directory
        mode: '0755'
      register: backup_dir_created

    - name: Back up the current gateway site file
      ansible.builtin.copy:
        remote_src: true
        src: "{{ gateway_dest }}"
        dest: "{{ backup_dir }}/{{ backup_stamp }}/llama-gateway"
      when: gateway_dest is file
      register: backup_site

    - name: Back up the (obsolete) profile directory
      ansible.builtin.command: cp -a {{ profile_dir }} {{ backup_dir }}/{{ backup_stamp }}/llama-profiles
      when: profile_dir is directory
      register: backup_profiles

    # --- Install the new gateway config (8502 -> LiteLLM 8506) ---
    - name: Deploy the new gateway site (8502 -> LiteLLM 8506)
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../nginx/llama-gateway"
        dest: "{{ gateway_dest }}"
        mode: '0644'
        owner: root
        group: root
      register: gateway_site

    - name: Ensure the site is enabled (symlink present)
      ansible.builtin.file:
        src: "{{ gateway_dest }}"
        dest: "{{ gateway_symlink }}"
        state: link

    # --- Remove the obsolete profile-symlink machinery ---
    - name: Remove the obsolete /etc/nginx/llama-profiles profile dir
      ansible.builtin.file:
        path: "{{ profile_dir }}"
        state: absent
      when: profile_dir is directory
      register: profile_removed

    # --- Validate, then reload (reload = graceful, no dropped connections) ---
    - name: Validate nginx configuration before reloading
      ansible.builtin.command: nginx -t
      register: nginx_test
      failed_when: nginx_test.rc != 0
      changed_when: false

    # One-time cutover: always validate then reload. Reload is graceful
    # (spins up new workers on the new config, drains old ones), so no
    # in-flight LLM requests are dropped.
    - name: Reload nginx (graceful, applies new gateway routing)
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
