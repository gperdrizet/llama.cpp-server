# raise_exception('System message must be at the beginnin...\n

[Qwen3.8-27B]
alias                = Qwen3.8-27B
model                = /home/siderealyear/llama.cpp/models/Qwen3.8-27B-UD-Q4_K_M.gguf
ctx-size             = 131072
batch-size           = 4096
ubatch-size          = 2048
