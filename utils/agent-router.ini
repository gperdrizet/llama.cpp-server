[*]
# Load all layers on GPU(s)
n-gpu-layers = -1

# Unload models from VRAM automatically after 5 minutes of total silence
sleep-idle-seconds = 300 

# Batch sizes - larger gives faster prefill at the cost of more VRAM usage
batch-size   = 4096
ubatch-size  = 4096

# ===============================================
# Light/fast conversational model
# ===============================================
[qwen]
alias                  = qwen
model                  = /home/siderealyear/llama.cpp/models/Qwen3.5-9B-Q4_K_M.gguf
ctx-size               = 131072
batch-size             = 2048
ubatch-size            = 1024
parallel               = 1
model-draft            = /home/siderealyear/llama.cpp/models/Qwen3.5-9B-dflash-Q4_K_M.gguf
spec-type              = draft-dflash
spec-draft-n-max       = 5
device                 = CUDA0
# Unsloth-recommended instruct (non-thinking) settings for Qwen3.5 Small
# (0.8B-9B ship with reasoning disabled by default) - general tasks
temp                   = 0.7
top-p                  = 0.8
top-k                  = 20
min-p                  = 0.0
presence-penalty       = 1.5
repeat-penalty         = 1.0


# ===============================================
# Heavy conversational model
# ===============================================
[gemma-4]
alias                = gemma-4
model                = /home/siderealyear/llama.cpp/models/gemma4-31B-it-Q4_K_M.gguf
ctx-size             = 65536
batch-size           = 2048
ubatch-size          = 1024
parallel             = 1
split-mode           = tensor
model-draft          = /home/siderealyear/llama.cpp/models/gemma4-31B-it-dflash-Q4_K_M.gguf
spec-type            = draft-dflash
spec-draft-n-max     = 5
# Google/Unsloth-recommended defaults for Gemma 4
temp                 = 1.0
top-p                = 0.95
top-k                = 64


# ===============================================
# Coder model
# ===============================================
[qwen-coder]
alias                = qwen-coder
model                = /home/siderealyear/llama.cpp/models/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf
ctx-size             = 131072
batch-size           = 2048
ubatch-size          = 1024
parallel             = 1
split-mode           = tensor
device               = CUDA0,CUDA1
# Unsloth/Qwen-recommended defaults for Qwen3-Coder-30B-A3B-Instruct
temp                 = 0.7
top-p                = 0.8
top-k                = 20
min-p                = 0.0
repeat-penalty       = 1.05

# ===============================================
# Heavy MOE coder model (spills to system RAM)
# ===============================================
[qwen-coder-heavy]
alias                = qwen-coder-heavy
model                = /home/siderealyear/llama.cpp/models/Qwen3-Coder-Next-Q8_0-00001-of-00003.gguf
ctx-size             = 131072
parallel             = 1
device               = CUDA0,CUDA1
cpu-moe              = true
load-mode            = none
# Unsloth-recommended defaults for Qwen3-Coder-Next
temp                 = 1.0
top-p                = 0.95
top-k                = 40
min-p                = 0.01
repeat-penalty       = 1.0


# ==========================================
# Big Reasoning Qwen (Pooled GPUs)
# ==========================================
[qwen-reasoning]
alias                = qwen-reasoning
model                = /home/siderealyear/llama.cpp/models/Qwen3.8-27B-UD-Q4_K_M.gguf
ctx-size             = 65536
batch-size           = 4096
ubatch-size          = 2048
parallel             = 1
split-mode           = tensor
reasoning-budget     = 16384
reasoning-budget-message = "... Thinking time limit reached. Stop reasoning and provide the final response now."
model-draft          = /home/siderealyear/llama.cpp/models/mtp-Qwen3.8-27B-Q4_0.gguf
spec-type            = draft-mtp
# Unsloth-recommended thinking-mode settings for Qwen3.8-27B
temp                 = 1.0
top-p                = 0.95
top-k                = 20
min-p                = 0.0
presence-penalty     = 0.0
repeat-penalty       = 1.0


# ==========================================
# Flash-Next (125B MoE, GPU-assisted) - long-horizon planning/synthesis
# Too big for 32GB VRAM alone; non-expert layers run on GPU, MoE experts
# spill to system RAM via --cpu-moe.
# ==========================================
[flash-next]
alias                = Qwen3.8-Flash-Next
model                = /home/siderealyear/llama.cpp/models/Qwen3.8-Flash-Next-Q8_0-00001-of-00006.gguf
ctx-size             = 262144
parallel             = 1
device               = CUDA0,CUDA1
cpu-moe              = true
flash-attn           = on
load-mode            = none
temp                 = 1.0
top-p                = 0.95
top-k                = 20
min-p                = 0.0
presence-penalty     = 0.0
repeat-penalty       = 1.0