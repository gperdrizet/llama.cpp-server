# Global settings for all models
[*]


# Server
host               = 0.0.0.0
port               = 8080
models-max         = 1
lazy-mode          = off
flash-attn         = on
jinja              = true

# KV cache & context
cache-type-k       = q8_0
cache-type-v       = q8_0
cache-ram          = -1
cache-idle-slots   = true
no-context-shift   = true
parallel           = 1
threads            = 18
threads-batch      = 18

# Model
metrics            = true
no-log-timestamps  = true
no-log-prefix      = true
verbosity          = 3

# Unload models from VRAM automatically after 5 minutes of total silence
sleep-idle-seconds = 300


# --------------------------------------------------------
# Qwen3.8-27B, reasoning low
# Dual GPU, fully resident, MTP draft decoding
#
# Cold TFT: ~48 seconds, Warm TFT: ~10 seconds
# Preprocessing/generation: 400/33 TPS
#
# Unsloth guide: https://unsloth.ai/docs/models/qwen3.8

[Qwen3.8-27B]

# Model
alias                 = default
model                 = /models/Qwen3.8-27B-UD-Q4_K_M.gguf
chat-template-file    = /config/template.jinja
n-gpu-layers          = -1
device                = CUDA0,CUDA1
split-mode            = tensor

# Context
ctx-size              = 131072 #163840
batch-size            = 4096
ubatch-size           = 2048

# Reasoning
reasoning-budget      = 8192
reasoning-format      = deepseek
no-reasoning-preserve = true
chat-template-kwargs  = {"reasoning_effort":"low"}
reasoning-budget-message = "... Thinking time limit reached. Stop reasoning and provide the final response now."

# Decoding
temp                  = 1.0
top-p                 = 0.95
top-k                 = 20
min-p                 = 0.0
presence-penalty      = 0.0
repeat-penalty        = 1.0

# Speculative decoding
model-draft           = /models/mtp-Qwen3.8-27B-Q4_0.gguf
spec-type             = draft-mtp
spec-draft-n-max      = 3

# --------------------------------------------------------
# Qwen3.8-Flash-Next, reasoning medium
# Dual GPU + CPU offload with mlock + MTP draft decoding
#
# Cold TFT: ~400 seconds, Warm TFT: ~40 seconds
# Preprocessing/generation: 88/12 TPS
#
# Unsloth guide: https://unsloth.ai/docs/models/qwen3.8-next

[Qwen3.8-Flash-Next]

# Model
alias                 = Qwen3.8-Flash-Next
model                 = /models/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
chat-template-file    = /config/template.jinja
split-mode            = layer
n-gpu-layers          = 40
cpu-moe               = true
load-mode             = mlock

# Context
ctx-size              = 131072
batch-size            = 2048
ubatch-size           = 1024

# Reasoning
reasoning-budget      = 8192
reasoning-format      = deepseek
no-reasoning-preserve = false
chat-template-kwargs  = {"reasoning_effort": "medium"}
reasoning-budget-message = "... Thinking time limit reached. Stop reasoning and provide the final response now."

# Decoding
temp                  = 1.0
top-p                 = 0.95
top-k                 = 20
min-p                 = 0.0
presence-penalty      = 0.0
repeat-penalty        = 1.0

# Speculative decoding
model-draft           = /models/mtp-Qwen3.8-Flash-Next-Q4_K_M.gguf
spec-type             = draft-mtp
spec-draft-n-max      = 3