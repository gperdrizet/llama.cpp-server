# Global settings for all models
[*]

# Server
host               = 0.0.0.0
port               = 8080
models-max         = 1
lazy-mode          = off
flash-attn         = on

# KV cache & context
cache-type-k       = q8_0
cache-type-v       = q8_0
cache-ram          = -1
cache-idle-slots   = true
no-context-shift   = true
parallel           = 1
threads            = 18
threads-batch      = 18
jinja              = true

# Model
metrics            = true
no-log-timestamps  = true
no-log-prefix      = true
verbosity          = 3

# Unload models from VRAM automatically after 1 minute of total silence
sleep-idle-seconds = 1800


# --------------------------------------------------------
# Qwen3.8-27B, reasoning low
# Dual GPU, fully resident, MTP draft decoding
#
# Cold TFT: ~48 seconds, Warm TFT: ~10 seconds
# Preprocessing/generation: 400/33 TPS
#
# Unsloth guide: https://unsloth.ai/docs/models/qwen3.8

[Qwen3.8-27B]

# Model
alias                 = default
model                 = /models/Qwen3.8-27B-UD-Q4_K_M.gguf
n-gpu-layers          = -1
device                = CUDA0,CUDA1
split-mode            = tensor

# Context
ctx-size              = 131072
batch-size            = 4096
ubatch-size           = 2048

# Reasoning
chat-template-file    = /config/template.jinja
reasoning-budget      = 8192
reasoning-format      = deepseek
no-reasoning-preserve = true
chat-template-kwargs  = {"reasoning_effort":"low"}
reasoning-budget-message = "... Thinking time limit reached. Stop reasoning and provide the final response now."

# Decoding
temp                  = 1.0
top-p                 = 0.95
top-k                 = 20
min-p                 = 0.0
presence-penalty      = 0.0
repeat-penalty        = 1.0

# Speculative decoding
model-draft           = /models/Qwen3.8-27B-mtp-Q4_0.gguf
spec-type             = draft-mtp
spec-draft-n-max      = 3

# Vision
mmproj                = /models/Qwen3.8-27B-mmproj-F16.gguf
image-min-tokens      = 1024


[Dark-Qwen3.8-27B]

# Model
alias                 = Dark-Qwen3.8-27B
model                 = /models/Huihui-Qwen3.8-27B-abliterated-UD-DW-Q4_K_M.gguf
n-gpu-layers          = -1
device                = CUDA0,CUDA1
split-mode            = tensor

# Context
ctx-size              = 131072
batch-size            = 4096
ubatch-size           = 2048

# Reasoning
chat-template-file    = /config/template.jinja
reasoning-budget      = 8192
reasoning-format      = deepseek
no-reasoning-preserve = true
chat-template-kwargs  = {"reasoning_effort":"low"}
reasoning-budget-message = "... Thinking time limit reached. Stop reasoning and provide the final response now."

# Decoding
temp                  = 1.0
top-p                 = 0.95
top-k                 = 20
min-p                 = 0.0
presence-penalty      = 0.0
repeat-penalty        = 1.0

# Speculative decoding
spec-type             = draft-mtp
spec-draft-n-max      = 3

# Vision
mmproj                = /models/Huihui-Qwen3.8-27B-abliterated-mmproj-bf16.gguf
image-min-tokens      = 1024

# --------------------------------------------------------
# Inkling-2-Mini, reasoning low (soft prompt hint)
# Looped MoE (inkling2_loop), fully resident, DSpark draft decoding
#
# Stock GGUF chat template: the server maps developer->system itself,
# so no patched template is needed.
# Unsloth GGUF: https://huggingface.co/unsloth/Inkling-2-Mini-GGUF
# (Mainline_Support layout: model + dspark drafter + mmproj)

[Inkling-2-Mini]

# Model
alias                 = Inkling-2-Mini
model                 = /models/Inkling-2-Mini-UD-Q4_K_XL.gguf
n-gpu-layers          = -1
device                = CUDA0,CUDA1
split-mode            = layer

# Context
# f16 KV: mainline q8_0 shows banding artifacts on the looped layers
ctx-size              = 131072
cache-type-k          = f16
cache-type-v          = f16
batch-size            = 4096
ubatch-size           = 2048

# Reasoning
# reasoning_effort is a soft prompt hint, not a hard token cap; the
# hard cap is reasoning-budget. v1.1.0's differential autoparser splits
# reasoning_content, so no reasoning-format is needed.
reasoning-budget      = 8192
chat-template-kwargs  = {"reasoning_effort":"low"}
reasoning-budget-message = "... Thinking time limit reached. Stop reasoning and provide the final response now."

# Decoding
temp                  = 1.0
top-p                 = 1.0
top-k                 = 0
min-p                 = 0.0

# Speculative decoding
# DSpark drafter; 5 is the CPU smoke-test value, try 3 on GPU.
model-draft           = /models/Inkling-2-Mini-dspark-Q8_0.gguf
spec-type             = draft-dspark
spec-draft-n-max      = 5

# Vision
mmproj                = /models/Inkling-2-Mini-mmproj-F16.gguf
image-min-tokens      = 1024


# --------------------------------------------------------
# Qwen3.8-Flash-Next, reasoning medium
# Dual GPU + CPU offload with mlock + MTP draft decoding
#
# Cold TFT: ~400 seconds, Warm TFT: ~40 seconds
# Preprocessing/generation: 88/12 TPS
#
# Unsloth guide: https://unsloth.ai/docs/models/qwen3.8-next

[Qwen3.8-Flash-Next]

# Model
alias                 = Qwen3.8-Flash-Next
model                 = /models/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
parallel              = 1
split-mode            = layer
n-gpu-layers          = -1
cpu-moe               = true
load-mode             = mlock

# Context
ctx-size              = 262144
batch-size            = 4096
ubatch-size           = 2048

# Reasoning
chat-template-file    = /config/template.jinja
reasoning-budget      = 16384
reasoning-format      = deepseek
chat-template-kwargs  = {"reasoning_effort": "medium"}
reasoning-budget-message = "... Thinking time limit reached. Stop reasoning and provide the final response now."

# Decoding
temp                  = 1.0
top-p                 = 0.95
top-k                 = 20
min-p                 = 0.0
presence-penalty      = 0.0
repeat-penalty        = 1.0

# Speculative decoding
model-draft           = /models/Qwen3.8-Flash-Next-mtp-Q4_K_M.gguf
spec-type             = draft-mtp
spec-draft-n-max      = 3

# Vision
mmproj                = /models/Qwen3.8-Flash-Next-mmproj-F16.gguf
image-min-tokens      = 1024


