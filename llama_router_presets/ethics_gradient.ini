# Globals for all models
[*]

# Server
host               = 0.0.0.0
port               = 8080
models-max         = 1
lazy-mode          = off
flash-attn         = on
n-gpu-layers       = -1
device             = CUDA0
jinja              = true

# KV cache & context
cache-type-k       = q8_0
cache-type-v       = q8_0
cache-ram          = -1
cache-idle-slots   = true
no-context-shift   = true
parallel           = 1
threads            = 18
threads-batch      = 18

# Model
metrics            = true
no-log-timestamps  = true
no-log-prefix      = true
verbosity          = 3


# --------------------------------------------------------
# Qwen2.5 coder 7b instruct
# Single GPU, fully resident

[Qwen2.5-Coder-7B]

# Model
alias                  = Qwen2.5-Coder-7B
model                  = /models/Qwen2.5-Coder-7B-Instruct-Q3_K_M.gguf

# Context
ctx-size               = 131072
batch-size             = 4096
ubatch-size            = 4096

# Decoding
temp                   = 0.1
top-p                  = 0.8
top-k                  = 20
repeat-penalty         = 1.05

# --------------------------------------------------------
# BGM-M3 embedding model
# Single GPU, fully resident

[BGE-M3]

# Model
alias                  = BGE-M3
model                  = /models/bge-m3-Q4_K_M.gguf
embedding              = true

# Context
ctx-size               = 4096
ubatch-size            = 1024